repository:
  private: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  has_issues: false
  has_projects: false
  has_wiki: false
  has_downloads: false

# No `branches` protection block here on purpose: private repos in the rn-ax
# org (GitHub Free plan) can't use branch protection until the org upgrades
# to GitHub Team or the repo is made public. Confirmed via
# `gh api repos/<org>/<repo>/branches/main/protection`, which 403s with
# "Upgrade to GitHub Pro or make this repository public to enable this
# feature." Add it back once either condition changes.
