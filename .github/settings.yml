_extends: poppycock:settings.yml

repository:
  private: false

# No `branches` protection block here (yet): it was dropped while this repo
# was private, since private repos in the rn-ax org (GitHub Free plan)
# can't use branch protection at all -- `gh api
# repos/<org>/<repo>/branches/main/protection` 403s with "Upgrade to GitHub
# Pro or make this repository public to enable this feature." Now that the
# repo is public, that limitation no longer applies -- add a `branches:`
# block back (see PR #2's original version) as a follow-up if branch
# protection on `main` is wanted.
